spring.application.name=payment-service

server.port=${PAYMENT_SERVER_PORT:8085}

# MongoDB configuration (with defaults and env overrides for Docker support)
spring.data.mongodb.uri=${PAYMENT_MONGODB_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:wisdom_payment}}

# Custom API Key config (with fallback default)
payment.api.key=${PAYMENT_API_KEY:wisdom-payment-key-2026}
