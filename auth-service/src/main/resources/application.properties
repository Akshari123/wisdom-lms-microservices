spring.application.name=auth-service

server.port=${AUTH_SERVER_PORT:8082}

# MongoDB configuration (with defaults and env overrides for Docker support)
spring.data.mongodb.uri=${AUTH_MONGODB_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:wisdom_lms_auth}}
spring.data.mongodb.database=${AUTH_MONGODB_DATABASE:wisdom_lms_auth}
