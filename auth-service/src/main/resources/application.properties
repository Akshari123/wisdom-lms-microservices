spring.application.name=auth-service

server.port=${AUTH_SERVER_PORT:8082}

# MongoDB configuration (with defaults and env overrides for Docker support)
spring.data.mongodb.uri=${AUTH_MONGODB_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:wisdom_lms_auth}}
spring.data.mongodb.database=${AUTH_MONGODB_DATABASE:wisdom_lms_auth}

# JWT Secret Key
jwt.secret=${JWT_SECRET:8a3c8e54e4c278bc032c589b278f2495b6c317ab321c8db19468e0d9b4b0e5d9}
jwt.expiration=${JWT_EXPIRATION:86400000}

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:change-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# The redirect URI must match Google Cloud Console and point to the Gateway
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/login/oauth2/code/google}
