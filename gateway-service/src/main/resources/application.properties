spring.application.name=gateway-service

server.port=${GATEWAY_SERVER_PORT:8080}


# ========================
# AUTH SERVICE
# ========================

# OAuth2 Authorization Endpoint
spring.cloud.gateway.routes[0].id=auth-service-oauth2-auth
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI:http://localhost:${AUTH_SERVER_PORT:8082}}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/oauth2/authorization/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/auth(?<segment>/?.*), $\{segment}

# OAuth2 Callback Endpoint
spring.cloud.gateway.routes[1].id=auth-service-oauth2-code
spring.cloud.gateway.routes[1].uri=${AUTH_SERVICE_URI:http://localhost:${AUTH_SERVER_PORT:8082}}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/login/oauth2/code/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/auth(?<segment>/?.*), $\{segment}

# General Auth Service Endpoints
spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].uri=${AUTH_SERVICE_URI:http://localhost:${AUTH_SERVER_PORT:8082}}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**


# ========================
# STUDENT SERVICE
# ========================

spring.cloud.gateway.routes[3].id=student-service
spring.cloud.gateway.routes[3].uri=${STUDENT_SERVICE_URI:http://localhost:${STUDENT_SERVER_PORT:8081}}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/students/**
spring.cloud.gateway.routes[3].filters[0]=SetRequestHeader=X-API-KEY,${INTERNAL_API_KEY:wisdom-lms-secret-key}


# ========================
# TEACHER SERVICE
# ========================

spring.cloud.gateway.routes[4].id=teacher-service
spring.cloud.gateway.routes[4].uri=${TEACHER_SERVICE_URI:http://localhost:${TEACHER_SERVER_PORT:8083}}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/teachers/**
spring.cloud.gateway.routes[4].filters[0]=SetRequestHeader=X-API-KEY,${INTERNAL_API_KEY:wisdom-lms-secret-key}


# ========================
# CLASS SERVICE
# ========================

spring.cloud.gateway.routes[5].id=class-service
spring.cloud.gateway.routes[5].uri=${CLASS_SERVICE_URI:http://localhost:${CLASS_SERVER_PORT:8084}}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/classes/**
spring.cloud.gateway.routes[5].filters[0]=SetRequestHeader=X-API-KEY,${INTERNAL_API_KEY:wisdom-lms-secret-key}


# ========================
# PAYMENT SERVICE
# ========================

spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=${PAYMENT_SERVICE_URI:http://localhost:${PAYMENT_SERVER_PORT:8085}}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/payments/**, /payments/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/api/payments(?<segment>/?.*), /payments$\{segment}
spring.cloud.gateway.routes[6].filters[1]=SetRequestHeader=X-API-KEY,${INTERNAL_API_KEY:wisdom-lms-secret-key}


# ========================
# CORS
# ========================

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
