spring.application.name=gateway-service

server.port=${GATEWAY_SERVER_PORT:8080}


# ========================
# AUTH SERVICE
# ========================

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:${AUTH_SERVER_PORT:8085}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.rate-limiter=#{@simpleRateLimiter}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@userKeyResolver}


# ========================
# STUDENT SERVICE
# ========================

spring.cloud.gateway.server.webflux.routes[1].id=student-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:${STUDENT_SERVER_PORT:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/students/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetRequestHeader=X-API-KEY,${STUDENT_API_KEY:student-secret-2026}


# ========================
# TEACHER SERVICE
# ========================

spring.cloud.gateway.server.webflux.routes[2].id=teacher-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:${TEACHER_SERVER_PORT:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/teachers/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetRequestHeader=X-API-KEY,${TEACHER_API_KEY:wisdom-teacher-secret-2026}


# ========================
# CLASS SERVICE
# ========================

spring.cloud.gateway.server.webflux.routes[3].id=class-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:${CLASS_SERVER_PORT:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/classes/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetRequestHeader=X-API-KEY,${CLASS_API_KEY:wisdom-lms-secret-key}


# ========================
# PAYMENT SERVICE
# ========================

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:${PAYMENT_SERVER_PORT:8086}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[4].filters[1]=SetRequestHeader=X-API-KEY,${PAYMENT_API_KEY:wisdom-payment-key-2026}


# ========================
# CORS
# ========================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${GATEWAY_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
