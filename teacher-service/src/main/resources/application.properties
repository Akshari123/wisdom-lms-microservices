spring.application.name=teacher-service

server.port=${TEACHER_SERVER_PORT:8083}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/wisdom_teacher_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:wisdom_user}
spring.datasource.password=${DB_PASSWORD:wisdom123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

app.api-key=${TEACHER_API_KEY:wisdom-teacher-secret-2026}
