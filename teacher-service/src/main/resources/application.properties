spring.application.name=teacher-service

server.port=8083

# MongoDB configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:wisdom_teacher_db}

spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

app.api-key=${API_KEY:wisdom-teacher-secret-2026}