spring.application.name=teacher-service

server.port=${TEACHER_SERVER_PORT:8083}

# MongoDB configuration
spring.data.mongodb.uri=${TEACHER_MONGODB_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:wisdom_teacher_db}}

spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

app.api-key=${TEACHER_API_KEY:${API_KEY:wisdom-teacher-secret-2026}}
